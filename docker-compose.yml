services:
  ngrok:
    image: ngrok/ngrok:latest@sha256:ff3b5c3674432d14a786349908b7bdf28ee56c25662637afcbe7180d471993ef
    command: http --url=${NGROK_SUBDOMAIN} grafana:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
  grafana:
    image: grafana/grafana:main@sha256:a0183bc04e65bfd70850895c637e940e28632ec6342bd041cfa1110856e5251d
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=provisioning,kubernetesDashboards
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_SERVER_ROOT_URL=https://${NGROK_SUBDOMAIN}

    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - renderer
      - ngrok
    restart: unless-stopped
  renderer:
    image: grafana/grafana-image-renderer:latest@sha256:cfa6c8f63e6d626f90208f2880f15bd5facc279daec1b9bb642af07aa850d95e
    ports:
      - 8081

volumes:
  grafana-data:
